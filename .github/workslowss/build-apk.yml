name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:   # ручной запуск кнопкой «Run workflow»

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Find project folder
        id: find
        run: |
          f=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n 1)
          if [ -z "$f" ]; then
            echo "::error::Файл settings.gradle.kts не найден: файлы проекта не загружены в репозиторий"
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
          echo "Проект найден в: $(dirname "$f")"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CacheClean-debug-apk
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
